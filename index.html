<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OD Approval System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card">
      <h1>OD Approval System</h1>
      <p class="muted">Student & Teacher/Administrator Portal</p>

      <form id="loginForm">
        <label>Email ID
          <input id="email" type="email" required placeholder="Enter your email">
        </label>

        <label>Password
          <input id="password" type="password" required placeholder="Enter your password">
        </label>

        <button class="primary" type="submit">Login</button>
        <p id="loginMessage" class="message"></p>
      </form>

      <p class="small">
        Student and admin accounts must be created in Supabase Authentication.
      </p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
