<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin OD Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div><strong>OD Approval System</strong><span class="role">Admin / Teacher</span></div>
  <button id="logoutBtn" class="secondary">Logout</button>
</header>

<main class="container">
  <section class="stats">
    <div class="stat card"><span>Total</span><strong id="totalCount">0</strong></div>
    <div class="stat card"><span>Pending</span><strong id="pendingCount">0</strong></div>
    <div class="stat card"><span>Approved</span><strong id="approvedCount">0</strong></div>
    <div class="stat card"><span>Disapproved</span><strong id="disapprovedCount">0</strong></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <input id="searchBox" placeholder="Search student, reg. no., or event">
      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
        <option value="Disapproved">Disapproved</option>
      </select>
      <select id="sortBy">
        <option value="date_desc">Event Date ↓</option>
        <option value="date_asc">Event Date ↑</option>
        <option value="name_asc">Student Name A-Z</option>
        <option value="name_desc">Student Name Z-A</option>
      </select>
      <button id="refreshBtn" class="secondary">Refresh</button>
    </div>

    <p id="adminMessage" class="message"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Student</th><th>Reg. No.</th><th>Event</th><th>Date</th>
            <th>Course / Slot</th><th>Status</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="adminRequests"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="approvalModal" class="modal hidden">
  <div class="modal-box">
    <h3>Update OD Status</h3>
    <p id="modalRequestInfo" class="muted"></p>
    <label>Status
      <select id="modalStatus">
        <option value="Approved">Approved</option>
        <option value="Disapproved">Disapproved</option>
      </select>
    </label>
    <label>Comment (optional)
      <textarea id="modalComment" rows="4" placeholder="Enter approval/disapproval comment"></textarea>
    </label>
    <div class="modal-actions">
      <button id="cancelModal" class="secondary">Cancel</button>
      <button id="saveStatus" class="primary">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
